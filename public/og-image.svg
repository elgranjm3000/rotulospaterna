<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1c30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fea619;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Decorative circles -->
  <circle cx="1000" cy="100" r="150" fill="#fea619" opacity="0.1"/>
  <circle cx="200" cy="500" r="200" fill="#fea619" opacity="0.1"/>

  <!-- Main content area -->
  <g transform="translate(100, 200)">
    <!-- Logo placeholder -->
    <rect x="0" y="-80" width="80" height="80" rx="16" fill="#fea619"/>
    <path d="M20 -60L35 -75L50 -60L65 -75L80 -60L65 -45L80 -30L65 -15L50 -30L35 -15L20 -30L35 -45L20 -60Z" fill="white" opacity="0.9"/>
    <text x="40" y="-35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">RP</text>

    <!-- Main title -->
    <text x="0" y="50" font-family="Montserrat, Arial, sans-serif" font-size="72" font-weight="800" fill="white">
      Rótulos Paterna
    </text>

    <!-- Subtitle -->
    <text x="0" y="110" font-family="Inter, Arial, sans-serif" font-size="28" fill="white" opacity="0.9">
      Soluciones Visuales Profesionales
    </text>

    <!-- Tagline -->
    <text x="0" y="160" font-family="Inter, Arial, sans-serif" font-size="20" fill="#fea619" font-weight="600">
      Hacemos que tu negocio sea imposible de ignorar
    </text>

    <!-- Location badge -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="200" height="40" rx="20" fill="white" opacity="0.2"/>
      <text x="100" y="27" font-family="Inter, Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">
        Paterna, Valencia
      </text>
    </g>
  </g>

  <!-- Visual element on right side -->
  <g transform="translate(750, 150)">
    <!-- Sign mockup -->
    <rect x="0" y="0" width="350" height="200" rx="10" fill="white" opacity="0.1"/>
    <rect x="20" y="20" width="310" height="160" rx="5" fill="#fea619" opacity="0.3"/>
    <text x="175" y="110" font-family="Montserrat, Arial, sans-serif" font-size="36" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">
      TU NEGOCIO
    </text>
    <text x="175" y="145" font-family="Inter, Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">
      Rotulación Profesional
    </text>
  </g>

  <!-- Bottom CTA -->
  <g transform="translate(100, 520)">
    <rect x="0" y="0" width="180" height="50" rx="25" fill="#fea619"/>
    <text x="90" y="33" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#0b1c30" text-anchor="middle">
      Pedir Presupuesto
    </text>
  </g>

  <!-- Contact info -->
  <g transform="translate(800, 520)">
    <text x="0" y="20" font-family="Inter, Arial, sans-serif" font-size="14" fill="white" opacity="0.8">
      +34 960 000 000
    </text>
    <text x="0" y="45" font-family="Inter, Arial, sans-serif" font-size="14" fill="white" opacity="0.8">
      info@rotulospaterna.com
    </text>
  </g>
</svg>
